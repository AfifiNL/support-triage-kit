[project]
name = "support-triage-kit"
version = "0.1.0"
description = "Support-ticket triage with an LLM behind deterministic gates: PII redaction, classification and routing, reply drafts that a person approves, and an eval gate."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hossam Afifi" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/AfifiNL/support-triage-kit"

[project.scripts]
support-triage-kit = "triage_kit.cli:main"

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["triage_kit"]
mypy_path = "src"
